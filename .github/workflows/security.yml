name: Security

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit
    runs-on: [self-hosted, heuresys, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm audit --omit=dev --audit-level=high || true

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: [self-hosted, heuresys, linux]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks
        run: |
          if ! command -v gitleaks >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_arm64.tar.gz               | tar xz -C "$HOME/.local/bin" gitleaks
            export PATH="$HOME/.local/bin:$PATH"
          fi
          gitleaks detect --source . --verbose --redact --exit-code 1
